name: CI

# For testing, you can set variables in your repo (Repo -> Settings ->
# Security -> Actions -> Variables) to restrict the tests that are run.
# The supported variables are:
#
# RUN_ONLY_TARGET_CONFIG: Run only the single matching target and config,
#   separated by spaces, eg "ubuntu-latest default".  All other tests will
#   fail immediately.
#
# LTESTS: Override the set of tests run.
# TEST_SSH_TRACE: Set to yes for additional regress output.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '**.c', '**.h', '**.m4', '**.rs', '**.sh', '**/Cargo.toml', '**/Makefile.in', 'configure.ac', '.github/configs', '.github/*.sh', '.github/workflows/c-cpp.yml' ]
  pull_request:
    paths: [ '**.c', '**.h', '**.m4', '**.rs', '**.sh', '**/Cargo.toml', '**/Makefile.in', 'configure.ac', '.github/configs', '.github/*.sh', '.github/workflows/c-cpp.yml' ]

jobs:
  ci:
    name: "${{ matrix.target }} ${{ matrix.config }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted'
    strategy:
      fail-fast: false
      matrix:
        # Keep automatic CI small enough for fork credit limits while covering
        # the Rust port, warning-clean builds, sanitizer coverage and major OSes.
        include:
          - { target: ubuntu-latest, config: default }
          - { target: ubuntu-latest, config: rust-crypto }
          - { target: ubuntu-22.04, config: gcc-12-Werror }
          - { target: ubuntu-22.04, config: clang-sanitize-undefined }
          - { target: ubuntu-22.04, config: without-openssl }
          - { target: ubuntu-24.04-arm, config: default }
          - { target: macos-15, config: default }
          - { target: windows-2025, config: cygwin-release }
    runs-on: ${{ matrix.target }}
    env:
      EPHEMERAL_VM: yes
      CYGWIN: "winsymlinks:native"
    steps:
    - name: check RUN_ONLY_TARGET_CONFIG
      if: vars.RUN_ONLY_TARGET_CONFIG != ''
      run: sh -c 'if [ "${{ vars.RUN_ONLY_TARGET_CONFIG }}" != "${{ matrix.target }} ${{matrix.config }}" ]; then exit 1; else exit 0; fi'
    - name: set cygwin git params
      if: ${{ startsWith(matrix.target, 'windows') }}
      run: git config --global core.autocrlf input
    - name: install cygwin
      id: cygwin_install
      if: ${{ startsWith(matrix.target, 'windows') }}
      uses: cygwin/cygwin-install-action@a3d72946b163026bbd0fa9a88379ccbda4bd86bb # master
    - name: checkout openssh git repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: setup CI system
      run: |
        sh -c "timeout 1200 .github/setup_ci.sh ${{ matrix.config }} ${{ matrix.target }} || .github/setup_ci.sh ${{ matrix.config }} ${{ matrix.target }}"
      env:
        CYGWIN_SETUP: ${{ steps.cygwin_install.outputs.setup }}
    - name: setup Rust toolchain
      if: ${{ matrix.config == 'rust-crypto' }}
      uses: dtolnay/rust-toolchain@stable
    - name: show Rust version
      if: ${{ matrix.config == 'rust-crypto' }}
      run: |
        rustc --version
        cargo --version
    - name: autoreconf
      run: sh -c autoreconf
    - name: configure
      run: sh ./.github/configure.sh ${{ matrix.config }}
    - name: cargo test
      if: ${{ matrix.config == 'rust-crypto' }}
      run: cargo test --manifest-path rust/crypto/Cargo.toml
    - name: cargo fuzz build
      if: ${{ matrix.config == 'rust-crypto' }}
      run: cargo build --manifest-path rust/crypto/fuzz/Cargo.toml
    - name: cargo fuzz smoke
      if: ${{ matrix.config == 'rust-crypto' }}
      run: |
        for target in ed25519_verify ecdh_peer dh_peer ecdsa_parse rsa_parse chachapoly_decrypt config_helpers packet_mac sshkey_metadata sshkey_lifecycle; do
          cargo run --manifest-path rust/crypto/fuzz/Cargo.toml --bin "$target" -- -runs=1
        done
    - name: save config
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # main
      with:
        name: ${{ matrix.target }}-${{ matrix.config }}-config
        path: config.h
    - name: make clean
      run: make clean
    - name: make
      run: make -j2
    - name: make tests
      run: sh ./.github/run_test.sh ${{ matrix.config }}
      env:
        TEST_SSH_UNSAFE_PERMISSIONS: 1
        TEST_SSH_HOSTBASED_AUTH: yes
        TEST_SSH_TRACE: ${{ vars.TEST_SSH_TRACE }}
        LTESTS: ${{ vars.LTESTS }}
    - name: test OpenSSL3 ABI compatibility
      if: ${{ startsWith(matrix.config, 'openssl-3') }}
      run: |
       sh .github/install_libcrypto.sh -a ${{ matrix.config }} /opt/openssl
       sh .github/run_test.sh ${{ matrix.config }}
    - name: chown logs
      if: failure()
      shell: sh
      run: |
        set -e
        SUDO=
        if command -v sudo >/dev/null 2>&1; then
          SUDO=sudo
        fi
        $SUDO chown -R "${LOGNAME}" regress
    - name: show logs
      if: failure()
      shell: sh
      run: |
        set -e
        for i in regress/failed*.log; do
          [ -e "$i" ] || continue
          echo ====
          echo logfile "$i"
          echo =====
          cat "$i"
        done
    - name: save logs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # main
      with:
        name: ${{ matrix.target }}-${{ matrix.config }}-logs
        path: |
          config.h
          config.log
          regress/
